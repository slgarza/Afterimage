name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The committed lockfile is the contract: CI installs exactly the graph
      # validated by the local integration step.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/swarm/requirements-pilot.txt
      - run: python -m unittest discover -s tools/swarm -p 'test_*.py'
      - run: ruff check --isolated tools/swarm/modal*.py tools/swarm/pilot*.py tools/swarm/probe_gateway.py tools/swarm/test_*.py
